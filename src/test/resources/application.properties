# To make sure when testing, it is using the h2 database instead of the PostgreSql database

jwt.secret=your-256-bit-secret-key-here-make-it-at-least-32-bytes-long
jwt.secret-key=my-secret-key-my-secret-key-my-secr
jwt.expiry-ms=86400000

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true